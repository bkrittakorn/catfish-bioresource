<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ติดต่อเรา | CATFISH BIORESOURCE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --blue: #4876a3;
      --blue-hover: #0b5394;
      --blue-light: #eff6ff;
      --ink: #1e293b;
      --muted: #64748b;
      --paper: #f8fafc;
      --white: #ffffff;
      --line: #e2e8f0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      font-family: Arial, "Prompt", sans-serif !important;
    }

    i, .fa, .fa-solid, .fa-regular, .fa-brands {
      font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands", Arial, "Prompt", sans-serif !important;
    }

    html, body {
      height: 100%;
      margin: 0;
    }
    
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--paper);
      color: var(--blue);
      line-height: 1.7;
    }
    
    main, main.container {
      flex: 1;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin-inline: auto;
    }

    /* Header & Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    
    .nav {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark-img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .04em;
      line-height: 1.3;
      color: var(--blue);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 21px;
      font-size: 15px;
      font-weight: 600;
      color: var(--blue);
    }

    .nav-links > a:hover, .nav-item-dropdown > a:hover { color: var(--blue-hover); }

    /* Language Toggle Switch */
    .lang-switch {
      position: relative;
      width: 76px;
      height: 32px;
      background-color: #e2e8f0;
      border-radius: 20px;
      border: none;
      padding: 0 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background-color 0.3s ease;
      user-select: none;
    }

    .lang-switch::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 34px;
      height: 26px;
      background-color: var(--blue);
      border-radius: 16px;
      transition: transform 0.3s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
    }

    html[lang="th"] .lang-switch::before {
      transform: translateX(36px);
    }

    .lang-label {
      font-size: 11px;
      font-weight: 800;
      z-index: 1;
      width: 30px;
      text-align: center;
      transition: color 0.3s ease;
    }

    .lang-label.en { color: #ffffff; }
    .lang-label.th { color: #64748b; }

    html[lang="th"] .lang-label.en { color: #64748b; }
    html[lang="th"] .lang-label.th { color: #ffffff; }

    /* Mega Menu */
    .nav-item-dropdown {
      position: relative;
      display: inline-block;
    }

    .mega-menu {
      display: none;
      position: absolute;
      top: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%);
      width: 620px;
      background-color: #1e293b;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      z-index: 10000;
      border: 1px solid var(--line, #e2e8f0);
    }
    
    .nav-item-dropdown:hover .mega-menu {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
    }

    .mega-menu-col-left {
      background-color: #0f172a;
      padding: 24px 20px;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .mega-menu-title {
      font-size: 16px;
      font-weight: 700;
      color: #93c5fd;
      margin: 0 0 6px 0;
    }

    .mega-menu-desc {
      font-size: 12px;
      color: #94a3b8;
      margin: 0;
      line-height: 1.5;
    }

    .mega-menu-col-right {
      background-color: #1e293b;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mega-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      transition: background-color 0.2s, color 0.2s;
    }

    .mega-menu-item:hover {
      background-color: var(--blue);
      color: #ffffff;
    }

    .mega-menu-item i {
      font-size: 12px;
      color: #94a3b8;
      transition: transform 0.2s;
    }

    .mega-menu-item:hover i {
      color: #ffffff;
      transform: translateX(3px);
    }

    /* Page Header */
    .page-header {
      padding: 60px 0 30px;
      text-align: center;
      background: transparent;
    }

    .page-header h1 {
      font-size: clamp(32px, 5vw, 44px);
      font-weight: 800;
      color: var(--blue);
      margin: 0 0 12px 0;
    }

    .page-header p {
      color: var(--muted);
      font-size: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Contact Content Layout */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 60px;
    }

    .contact-info-card, .contact-map-card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(72, 118, 163, 0.05);
    }

    .contact-info-card h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--blue);
      margin-top: 0;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--blue-light);
      padding-bottom: 10px;
    }

    .contact-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }

    .contact-item i {
      font-size: 18px;
      color: var(--blue);
      margin-top: 4px;
      flex-shrink: 0;
    }

    .contact-item div h3 {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 4px 0;
    }

    .contact-item div p, .contact-item div a {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
      line-height: 1.6;
    }

    .contact-item div a:hover {
      color: var(--blue-hover);
      text-decoration: underline;
    }

    .map-container {
      width: 100%;
      height: 380px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .map-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      background-color: var(--blue);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .map-link-btn:hover {
      background-color: var(--blue-hover);
      color: white;
      text-decoration: none;
    }

    /* Footer สไตล์ NIA */
    .site-footer {
      background-color: #242238;
      color: #ffffff;
      padding: 40px 0;
      font-size: 13px;
      border-top: 1px solid #3b3953;
      margin-top: auto;
    }

    .footer-container {
      width: min(1120px, calc(100% - 40px));
      margin-inline: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .footer-info {
      flex: 1.2;
      min-width: 280px;
    }

    .footer-info h3 {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 8px 0;
    }

    .footer-info p {
      margin: 0 0 4px 0;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .footer-info a {
      color: #93c5fd;
    }

    .footer-social {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 0.8;
      min-width: 220px;
    }

    .footer-social span {
      font-weight: 600;
      color: #ffffff;
    }

    .footer-social-icons {
      display: flex;
      gap: 8px;
    }

    .footer-social-icon {
      width: 32px;
      height: 32px;
      background-color: #3b3953;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      color: white;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .footer-social-icon:hover {
      background-color: #4876a3;
    }

    .footer-social-icon svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .footer-newsletter {
      flex: 1.2;
      min-width: 300px;
    }

    .footer-newsletter label {
      display: block;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .newsletter-form {
      display: flex;
      gap: 0;
    }

    .newsletter-input {
      flex: 1;
      background-color: #1e1c2e;
      border: 1px solid #4a4863;
      border-right: none;
      padding: 9px 12px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      border-radius: 4px 0 0 4px;
    }

    .newsletter-input::placeholder {
      color: #94a3b8;
    }

    .newsletter-btn {
      background-color: #b91c1c;
      color: white;
      border: none;
      padding: 9px 18px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border-radius: 0 4px 4px 0;
      transition: background-color 0.2s;
    }

    .newsletter-btn:hover {
      background-color: #991b1b;
    }

    @media (max-width: 900px) {
      .contact-grid {
        grid-template-columns: 1fr;
      }
      .footer-container {
        flex-direction: column;
        align-items: flex-start;
        gap: 24px;
      }
      .footer-newsletter {
        width: 100%;
      }
    }

    @media (max-width: 800px) {
      .nav { padding: 13px 0; flex-wrap: wrap; }
      .nav-links { order: 3; width: 100%; gap: 16px; flex-wrap: wrap; }
    }
  </style>
</head>

<body>
  <!-- Header Section พร้อม Mega Menu -->
  <header>
    <div class="container nav">
      <a class="brand" href="index.html#home" aria-label="CATFISH BIORESOURCE Home">
        <img src="images/Catfish Bioresource Logo.png" alt="CATFISH BIORESOURCE Logo" class="brand-mark-img">
